server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin reverse proxy for the API. The SPA calls /api/... on its own
  # origin, so it works through the HTTPS ngrok tunnel without mixed content
  # or CORS, and locally at http://localhost:8080 through this same proxy.
  # The service name is resolved at request time via Docker's embedded DNS so
  # a recreated api container (new IP) needs no nginx restart.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  # SPA deep-link fallback: unknown paths serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
